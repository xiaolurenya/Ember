name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# 必须显式给写权限：默认的 GITHUB_TOKEN 是只读，
# softprops/action-gh-release 挂 APK 时会报
# "Resource not accessible by integration"（update-a-release）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 正式签名：secrets 齐了就生成 key.properties（app/build.gradle.kts 会读它），
      # 没配就自动退回 debug 签名，保证任何时候都能出可安装的包。
      - name: 准备签名密钥
        env:
          KS_BASE64: ${{ secrets.EMBER_KS_BASE64 }}
          KS_PW: ${{ secrets.EMBER_KS_PW }}
          KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
          KEY_PW: ${{ secrets.EMBER_KEY_PW }}
        run: |
          set -e
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$HOME/ember.jks"
            cat > key.properties <<EOF
          storeFile=$HOME/ember.jks
          storePassword=$KS_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
            echo "已生成 key.properties，使用正式签名"
          else
            echo "未配置签名 secrets，本次使用 debug 签名"
            rm -f key.properties
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        if: env.HAS_KS != ''
        env:
          HAS_KS: ${{ secrets.EMBER_KS_BASE64 }}
        run: |
          APK=app/build/outputs/apk/release/app-universal-release.apk
          echo "== 证书主体（应为 CN=Ember，出现 CN=Android Debug 就是退回了调试签名）=="
          keytool -printcert -jarfile "$APK" | sed -n '1,12p'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # release: published 时把 APK 挂到 Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
