name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# 必须显式给写权限：默认的 GITHUB_TOKEN 是只读，
# softprops/action-gh-release 挂 APK 时会报
# "Resource not accessible by integration"（update-a-release）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # release: published 时把 APK 挂到 Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
